# Observabilidad OPCIONAL: ver todos los prompts, respuestas, tokens y costo.
#
# Se suma al compose normal con -f y se prende con tools/observabilidad.sh.
# NO va en un cliente por defecto — ver las advertencias de abajo.
#
#   Hermes --(model.base_url)--> litellm --> OpenRouter
#                                   |
#                                   +-- OTLP --> phoenix (UI)
#
# POR QUE HACE FALTA UN PROXY: el `monitoring` nativo de Hermes exporta OTLP
# pero es "content-free by construction — no prompts, messages, tool
# args/results". Justo lo que se quiere ver es lo unico que no exporta.
#
# TRES COSAS QUE HAY QUE SABER ANTES DE PRENDERLO EN UN CLIENTE:
#
# 1. Es un punto de falla nuevo. Si litellm se cae, el agente deja de pensar.
#    En una caja de desarrollo se banca; en la de un cliente es cambiar su
#    disponibilidad por comodidad nuestra.
# 2. Phoenix GUARDA LOS PROMPTS, y los prompts son los datos del cliente. No
#    salen de su maquina, pero los estariamos leyendo nosotros. Con un cliente
#    real eso se avisa o no se hace.
# 3. Suma ~600 MB de RAM entre los dos.
#
# Phoenix escucha SOLO en loopback a proposito: se mira por tunel SSH
#   ssh -L 6006:localhost:6006 <host>   ->   http://localhost:6006
# Publicarlo seria dejar la conversacion entera de un cliente en internet
# detras de una UI sin contraseña.

services:
  phoenix:
    image: arizephoenix/phoenix:latest
    container_name: ${CLIENTE}-phoenix
    restart: unless-stopped
    ports:
      - "127.0.0.1:6006:6006"   # UI + OTLP HTTP. NUNCA 0.0.0.0.
    environment:
      - PHOENIX_WORKING_DIR=/data
    volumes:
      - phoenix_data:/data

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: ${CLIENTE}-litellm
    restart: unless-stopped
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    expose:
      - "4000"
    volumes:
      - ./litellm.yaml:/app/config.yaml:ro
    environment:
      # OJO: la clave NO va acá. `environment` PISA a `env_file`, y como
      # ${OPENROUTER_API_KEY} se interpola del .env del compose (que no la
      # tiene), le entraba la clave VACIA al proxy. Viene sola por env_file.
      - PHOENIX_COLLECTOR_ENDPOINT=http://phoenix:6006
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://phoenix:6006/v1/traces
    env_file:
      - ./data/.env
    depends_on:
      - phoenix

volumes:
  phoenix_data:
