model:
  provider: openrouter
  api_key: ${OPENROUTER_API_KEY}
  default: openai/gpt-5.6-luna

api_server:
  enabled: true
  host: 0.0.0.0
  port: 8642
  key: ${API_SERVER_KEY}

# Herramientas nativas de kanban. Hacen falta LAS DOS claves de abajo y no es
# adivinable: `toolsets` abre la compuerta (check_fn), y `platform_toolsets`
# pasa el filtro por plataforma. Con una sola, el agente no ve ninguna tool de
# kanban y termina improvisando por terminal. Verificado el 4/8/2026.
toolsets:
  - kanban

# Herramientas que un agente de cliente no usa nunca y cuyo esquema se paga en
# CADA llamada al modelo. Medido con `hermes prompt-size` sobre un agente
# recien creado: los esquemas pesan 67,6 KB (casi el doble del system prompt
# entero), y sacando estas dos bajan a 60,0 KB sin perder nada.
#   tts        1,8 KB  hablar en voz alta
#   delegation 5,8 KB  crear sub-agentes
# Si un cliente llega a necesitarlas, se sacan de esta lista y se reinicia.
agent:
  # Effort al maximo. Probado el 5/8 sobre el mismo agente, mismos datos y
  # mismas consignas: con el default del proveedor dejaba 3 de 18 clientes
  # afuera de una hoja de ruta diciendo que eran 18, mezclaba meses en un
  # ranking y erraba una bonificacion en cascada. Con `max` las tres salieron
  # bien de primera. Costo: ruido (USD 0,18 por 13 sesiones completas).
  # OJO: no arregla la complacencia — con max igual se auto-acuso de inventar
  # a alguien que estaba en su propio SOUL.
  reasoning_effort: max
  disabled_toolsets:
    - tts
    - delegation
    # OJO: el browser NO se apaga desde aca. Va por `platform_toolsets`, mas
    # abajo, y el porque esta explicado ahi: ponerlo en esta lista se lleva
    # puesto `web_search`.
    # cronjob apagado A PROPOSITO, y no para ahorrar contexto: es lo que
    # empuja al agente a la skill `flujo` en vez de improvisar un cron suelto.
    # Verificado el 8/8: un cliente pidio "quiero saber regularmente sobre la
    # competencia", el agente MIRO la skill flujo (skill_view) y aun asi llamo
    # a `cronjob` directo. Salio un cron invisible —sin carpeta, sin FLUJO.md,
    # sin pestaña Flujos— y encima con `deliver=origin`, que entrega a la
    # sesion del portal: iba a correr todos los lunes y no iba a llegar nunca
    # nada, sin ningun aviso. Con el toolset apagado el unico camino comodo es
    # `crear_flujo.py`, que crea el cron con --deliver=local y deja el flujo a
    # la vista. No es una pared: por terminal se puede igual, y de eso se
    # encarga el SOUL. Es sacar la puerta facil que daba al lugar equivocado.
    - cronjob

# EL BROWSER SE SACA POR INCLUSION, NO POR `disabled_toolsets`. La diferencia no
# es de estilo: `disabled_toolsets` resta el CATALOGO ESTATICO del toolset al
# final de todo (model_tools.py:410-441, "even if a composite toolset is enabled,
# any tools belonging to a disabled toolset are strictly stripped out"), y el
# catalogo de `browser` incluye `web_search` (toolsets.py:199-207). O sea que
# apagar browser por ahi tambien apaga la busqueda web, aunque `web_search` sea
# del toolset `web`. Medido con el interprete de la imagen, como llama el motor
# de verdad (agent/agent_init.py:1390, con enabled Y disabled), las tres filas en
# UNA sola corrida y con una credencial de busqueda presente para que
# `check_web_api_key` no tape el resultado:
#
#   bundle (browser adentro)             → 36 tools · browser 9 · web_search SI
#   bundle + disabled_toolsets:[browser] → 26 tools · browser 0 · web_search NO
#   lista explicita sin browser          → 27 tools · browser 0 · web_search SI
#
# Por nombre, que es lo que no se desarma: (bundle − explicita) = las 9
# browser_*, y (explicita − bundle) = nada; (explicita − disabled) = web_search.
#
# Queremos `web_search`: el cliente hace monitoreo de competencia y es probable
# que suba una key de busqueda.
#
# LAS TRES PLATAFORMAS LLEVAN LA MISMA LISTA. El mismo agente atiende el portal,
# Telegram y los flujos del cron: un browser que devuelve paginas en blanco falla
# igual en los tres, y en el cron encima sin nadie mirando. Ademas las
# declaraciones viejas de telegram y cron NO HACIAN NADA: una lista que solo
# nombra bundles y `kanban` no menciona ningun toolset configurable, asi que el
# motor no entra en modo explicito y cae al default —todo prendido, con browser,
# `clarify` y `computer_use`—. Verificado: sacar esas claves daba exactamente el
# mismo resultado que dejarlas.
#
# Diferencias deliberadas contra ese default: se van tambien `clarify`
# (preguntar por una UI — el portal nunca lo tuvo, el cron lo apaga solo, y el
# agente pregunta escribiendo) y `computer_use` (manejar una computadora, cuya
# skill ya apagamos).
#
# ESTA LISTA SE GENERA, no se escribe de memoria — al subir de tag el motor
# puede sumar o renombrar toolsets y esto queda viejo en silencio:
#   python3 tools/perilla-skills.py --toolsets --imagen <tag>
# `agente-check.py` compara las tres contra esta y falla si difieren.
platform_toolsets:
  api_server:
    - bfl
    - code_execution
    - file
    - image_gen
    - kanban
    - memory
    - session_search
    - skills
    - terminal
    - todo
    - vision
    - web
  telegram:
    - bfl
    - code_execution
    - file
    - image_gen
    - kanban
    - memory
    - session_search
    - skills
    - terminal
    - todo
    - vision
    - web
  cron:
    - bfl
    - code_execution
    - file
    - image_gen
    - kanban
    - memory
    - session_search
    - skills
    - terminal
    - todo
    - vision
    - web

# EL VERIFICADOR DE MUTACIONES, APAGADO. Cuando un write_file o un patch falla
# y no se repite bien, el motor le PEGA a la respuesta del agente una linea como
#   "⚠️ File-mutation verifier: 1 file(s) were NOT modified this turn…
#    /tmp/design-kit-instagram.md — Write denied… outside HERMES_WRITE_SAFE_ROOT"
# Eso lo lee el cliente en su portal: vocabulario de maquina, una ruta del host y
# el nombre de una variable de entorno. Es exactamente lo que el SOUL le prohibe
# al agente ("hablas del trabajo, no de la maquina") y que el motor hace igual,
# por arriba, sin que el agente pueda evitarlo. Visto con Mr.Wobble el 12/8.
# Que el intento fallara esta bien y hay que arreglarlo; contarselo asi al
# cliente, no. Perilla: hermes_cli/config_defaults.py:1051, leida en
# run_agent.py:3300.
display:
  file_mutation_verifier: false

# LA PUERTA, EN CODIGO Y NO EN PROSA. El motor corre estos scripts ANTES de la
# tool y, si contestan {"action":"block"}, no la ejecuta y le devuelve el
# mensaje al modelo (agent/shell_hooks.py; registro en gateway/run.py:10499).
# Cubre las tres cosas que el QA vio o dejo abiertas: instalar software en el
# volumen del cliente, firmar un comentario como `portal` (o sea falsificar una
# aprobacion) y desbloquearse el propio ticket.
#
# El consentimiento va ACA y en el compose (HERMES_ACCEPT_HOOKS=1), NUNCA por el
# allowlist de data/: ese vive en el volumen y el agente lo puede borrar, y un
# hook sin consentimiento FALLA ABIERTO.
#
# OJO: el hook falla abierto por diseño (si el script revienta o vence el
# timeout, la tool corre igual con un logger.warning que nadie mira). Por eso
# `agente-check.py` chequea que este declarado, que el script exista, que sea
# ejecutable y que de verdad bloquee.
hooks_auto_accept: true
hooks:
  pre_tool_call:
    - matcher: "terminal"
      command: "/opt/politica/hooks/puerta.py"
      timeout: 10
    - matcher: "kanban_unblock"
      command: "/opt/politica/hooks/puerta.py"
      timeout: 10

# AUTO-MEJORA: cada 25 turnos, no cada 10. El fork que escribe skills se dispara
# por VOLUMEN de trabajo, no por calidad (turn_finalizer.py:633-637), asi que
# cuanto mas sufre el agente por no tener la herramienta correcta, mas probable
# es que canonice el sufrimiento — es la causa mecanica de la skill que fijaba
# "dibujar el SVG a mano" como metodo. No se apaga: es la unica fuente que
# tenemos de que le falta a un agente en produccion. Se acota y se cosecha.
# La clave no tiene default declarado en config_defaults.py: vive como el
# .get(..., 10) de agent_init.py:1706-1710, asi que un bump puede cambiar el
# numero sin que nada falle.
# EL PREAMBULO DEL PORTAL. Sin esto, el motor le mete al agente —en cada sesion
# del api_server, 200 lineas DESPUES del SOUL— un parrafo que dice "the
# rendering layer is unknown, assume plain text, no markdown formatting" y que
# le explica las etiquetas MEDIA: con rutas absolutas del host
# (hermes:agent/prompt_builder.py:912-923). Las dos cosas son falsas en nuestro
# portal, que renderiza markdown completo con Markdown.tsx y convierte rutas e
# ids en chips clicables. `replace` lo reemplaza entero; `append` lo dejaria y
# sumaria al lado (hermes:agent/system_prompt.py:73-119).
#
# El texto lo lee el modelo: se escribe con el mismo cuidado que el SOUL.
platform_hints:
  api_server:
    replace: |
      Estás respondiendo dentro del portal de tu cliente, en el navegador.

      Se renderiza markdown completo: encabezados, listas, tablas, bloques de
      código, fórmulas y diagramas mermaid. Usalo cuando ayude a leer, no para
      adornar: una respuesta de dos líneas sigue siendo dos líneas.

      Los ids de ticket (t_...), los artefactos (art_...) y las rutas que
      arrancan en workspace/ se convierten solos en algo que se abre de un
      click. Nombralos tal cual, sin adornarlos.

      Nunca escribas rutas absolutas del sistema ni etiquetas MEDIA:. No se
      renderizan, y una ruta absoluta muestra las tripas del servidor sin
      ayudar a nadie: la ruta desde workspace/ ya alcanza.

# Sin `platforms.telegram.enabled` el adapter de Telegram bootea a medias:
# loguea "Connecting" pero el polling nunca arranca y los mensajes no llegan
# (descubierto el 7/8/2026 con East: /start sin respuesta, cero errores).
# El home_channel arranca apuntando a soporte; se cambia al chat del cliente
# cuando se empareja.
# EL DESPEDAZADOR AUTOMATICO, APAGADO. Corrompio una aprobacion en el QA y la
# cadena esta medida de punta a punta: la clienta aprobo CON CORRECCION ("20, no
# 8, y para el jueves"), el segundo rebloqueo por la misma causa mando el ticket
# a `triage` (BLOCK_RECURRENCE_LIMIT = 2, hardcodeado), el dispatcher barre
# triage en cada tick y llama al decomposer, y el decomposer arma su prompt con
# TITULO Y CUERPO SOLAMENTE (kanban_decompose.py:306-312). Los comentarios no
# viajan — y la correccion de la clienta vive en un comentario, porque el cuerpo
# de un ticket bloqueado no se puede reescribir desde afuera. Salieron dos
# tareas hijas pidiendo las 8 viejas y el portal pidiendo aprobar por tercera
# vez el numero equivocado. Con el correo conectado, al proveedor le llegaban 8.
#
# Ninguna skill ni script del kit usa `decompose`, y el motor relee la perilla
# en cada tick: no hace falta reiniciar. Probado en el lab: con esto apagado, un
# ticket que cae en triage ya no se parte (0 hijas contra 2).
kanban:
  auto_decompose: false

platforms:
  telegram:
    enabled: true
    home_channel:
      platform: telegram
      chat_id: 'COMPLETAR_CHAT_ID'
      name: COMPLETAR_NOMBRE
      user_id: 'COMPLETAR_CHAT_ID'

# <<< generado por tools/perilla-skills.py — no editar a mano
