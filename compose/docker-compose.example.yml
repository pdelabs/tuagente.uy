# Plantilla para el agente de un cliente. Un agente por cliente: su propio
# volumen, su propia clave. Nunca compartir nada entre clientes.
#
# LA VERSION VA FIJA, no `latest`. Con `latest`, un push de Nous le cambia el
# motor a TODOS los clientes de un dia para el otro, sin que nadie apriete
# nada, y nos enteramos por un ticket que empieza a fallar. Verificado el
# 5/8/2026: los agentes corrian v2026.7.30 mientras `latest` ya iba dos
# versiones adelante.
#
# Para subir de version: cambiar el tag, `docker compose pull && up -d`, y
# correr los dos chequeos (agente-check.py y portal-check.py) ANTES de darlo
# por bueno. Si algo cambio, se vuelve al tag anterior y listo.
services:
  hermes:
    image: nousresearch/hermes-agent:v2026.7.30   # ver nota de arriba antes de subirla
    container_name: ${CLIENTE}-hermes
    restart: unless-stopped
    command: gateway run
    ports:
      # Solo loopback: el portal llega por el adapter o por un túnel, nunca
      # exponiendo el gateway a internet.
      #
      # EL PUERTO DEL HOST LO RESUELVE `nuevo-agente.sh` (cuarto argumento, por
      # defecto 8642); adentro del contenedor SIEMPRE es 8642, que es lo que
      # dice `api_server.port` del config y lo que el adapter busca en
      # `http://hermes:8642`. Antes esto era literal en los dos lados y el
      # segundo agente del mismo host nacía pidiendo un puerto tomado: como los
      # nombres de contenedor sí se distinguen, el choque recién aparecía en el
      # `up -d`, con el SOUL ya escrito y las claves ya cargadas.
      - "127.0.0.1:${PUERTO_GATEWAY}:8642"   # API server
      # El dashboard (9119) NO se publica: va apagado (ver HERMES_DASHBOARD más
      # abajo). Si alguna vez hace falta mirarlo, se prende, se publica esta
      # línea y se entra por un túnel SSH — nunca es para el cliente.
      # - "127.0.0.1:9119:9119"
    volumes:
      - ./data:/opt/data
      # SOLO LECTURA, y es el punto entero: acá vive qué puede hacer el agente
      # con cada conexión. Si estuviera dentro de ./data podría editarlo con
      # write_file o por terminal, y un guardrail que el guardado puede
      # cambiar no es un guardrail.
      - ./politica:/opt/politica:ro
      # Las skills del kit, de SOLO LECTURA y fuera de ./data. El motor las
      # indexa igual (skills.external_dirs en config.yaml), pero el agente no
      # puede reescribirlas con skill_manage ni por terminal, y el curator
      # —que archiva a los 90 dias sin uso lo que toma por "creado por el
      # agente"— no las toca: una skill externa nunca es elegible.
      - ./kit-skills:/opt/kit/skills:ro
      # s6 corre esto antes del gateway, en cada arranque. Hoy traduce al
      # español el mensaje de pairing de Telegram, que viene hardcodeado en
      # run.py y le pide al cliente que corra un comando de terminal —
      # contradiciendo al portal, que le dice "pegá el código acá".
      #
      # EL ARCHIVO TIENE QUE EXISTIR ANTES DEL PRIMER `up`: Docker, al montar
      # algo que no está, crea un DIRECTORIO con ese nombre, y un directorio en
      # /etc/cont-init.d/ hace que s6 no levante nada. Lo pone `install.sh`, que
      # corre antes — esta línea y esa copia van juntas o no van.
      #
      # Al ACTUALIZARLO en un agente que ya corre: `install.sh` lo copia con
      # `cp`, que conserva el inodo, así que el contenedor ve el archivo nuevo y
      # alcanza con reiniciarlo. Si lo pasás con rsync o con mv —que reemplazan
      # el archivo— el montaje se queda con el viejo: ahí hace falta
      # `docker compose up -d --force-recreate`.
      - ./politica/cont-init-parches.sh:/etc/cont-init.d/03-parches:ro
      # La misma idea, y nos faltaba: config.yaml vive dentro de ./data y es
      # PROPIEDAD del agente. Verificado el 9/8/2026 — lo escribe. Ahí están
      # `disabled_toolsets` (donde apagamos cronjob a propósito) y el registro
      # de MCP: podía devolverse cronjob y saltearse la guardia esperando un
      # reinicio.
      # Se creía que en el PRIMER arranque había que levantar SIN esta línea
      # (Hermes escribe y migra el config) y agregarla después. Con v2026.7.30
      # no hace falta: verificado el 12/8/2026 sobre un agente creado de cero,
      # que arrancó bien con el archivo :ro desde el primer arranque. Al SUBIR
      # DE VERSIÓN del motor la precaución sigue valiendo: si la nueva migra el
      # config, se saca la línea, se arranca una vez y se vuelve a poner.
      - ./data/config.yaml:/opt/data/config.yaml:ro
      # EL PLUGIN `promesas`, DE SOLO LECTURA. El motor busca los plugins del
      # usuario en HERMES_HOME/plugins (`hermes_cli/plugins.py:1369`), o sea
      # adentro de ./data, que es del agente: sin este montaje encima, el
      # agente puede borrar de un `rm` la guardia que le impide anunciar un
      # flujo que no creó. Es la misma razón por la que politica/ está afuera.
      # Se prende con `plugins.enabled` en el config, que también es :ro.
      - ./politica/plugins:/opt/data/plugins:ro
    environment:
      - TZ=America/Montevideo
      # DASHBOARD APAGADO. Con =1 el motor intenta bindear el dashboard en
      # 0.0.0.0:9119, se niega porque no hay proveedor de auth configurado, s6
      # lo reinicia, y vuelve a empezar. Medido en un agente local recién
      # levantado (12/8/2026, Docker Desktop en macOS): 27 reinicios y 216
      # líneas de log POR MINUTO, de un bloque de seis líneas que se repite.
      #
      # No rompe el agente: rompe `docker compose logs`, que en un alta es la
      # única herramienta de diagnóstico que hay. Un ERROR de verdad tapado por
      # 216 líneas de ruido es un ERROR que nadie ve.
      #
      # (Durante un tiempo esto decía =1 acá y =0 en el compose remoto, con un
      # comentario que decía que "en la Mac no se nota porque igual queda detrás
      # de 127.0.0.1". Es falso: el 127.0.0.1 es el mapeo del HOST, y adentro
      # del contenedor el dashboard igual intenta 0.0.0.0. El loop es idéntico.)
      - HERMES_DASHBOARD=0
      # El consentimiento de los hooks va ACA y no en el allowlist de data/:
      # ese vive en el volumen del agente, que lo puede borrar — y un hook sin
      # consentimiento no corre, o sea que la puerta queda abierta sin ruido.
      - HERMES_ACCEPT_HOOKS=1
      # Sin esto el browser descarta todas las respuestas del gateway.
      #
      # VAN LAS DOS ESCRITURAS DEL LOOPBACK: `localhost` y `127.0.0.1` son
      # orígenes DISTINTOS para el browser, y el portal de desarrollo se abre
      # con cualquiera de las dos (el link mágico que armamos para probar suele
      # llevar 127.0.0.1). Con una sola, curl anda —no manda `Origin`— y el
      # browser no: es el "anda por curl y no anda en el navegador" clásico, y
      # se arreglaba a mano en cada alta, en los dos servicios.
      - API_SERVER_CORS_ORIGINS=https://tuagente.uy,https://app.tuagente.uy,http://localhost:8090,http://127.0.0.1:8090
    # LOS SECRETOS NO VIVEN EN data/, y es una cadena de escalada, no un gusto:
    # `data/` es del agente, este archivo es el env_file de los DOS servicios, y
    # con una variable como PYTHONPATH el agente ejecuta codigo suyo adentro de
    # este contenedor —medido— y de ahi llega a politica/ y al cont-init que s6
    # corre como root. Vive afuera, root:root 600, sin ningun montaje que lo
    # exponga al agente.
    env_file:
      - ./secretos.env
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"

  portal-adapter:
    image: nousresearch/hermes-agent:v2026.7.30   # ver nota de arriba antes de subirla
    container_name: ${CLIENTE}-portal-adapter
    restart: unless-stopped
    # EL CODIGO DEL ADAPTER NO SALE DE data/. `data/` es del agente (la tiene rw y
    # adentro de su contenedor corre como root), asi que podia reescribir el
    # archivo que este servicio ejecuta. Ahora viene de kit-adapter/, montada :ro.
    #
    # QUE CIERRA Y QUE NO, para que nadie lea de mas: cierra que el agente elija
    # DIRECTAMENTE el codigo del adapter, y que ese codigo corra como root (ver
    # `user:`). NO cerraba, por si solo, el camino por el env_file: mientras los
    # secretos vivieron en `data/.env` —del agente— un `PYTHONPATH=/opt/data/...`
    # le hacia ejecutar codigo suyo ADENTRO de este contenedor igual, y desde ahi
    # llegaba a `politica/`: la puerta y el `cont-init` que s6 corre como root en
    # hermes. Medido con la imagen real. Por eso los secretos salieron de data/
    # (ver `env_file`): hacen falta LAS DOS cosas, y ninguna sirve sola.
    entrypoint: ["python3", "/opt/kit/adapter/portal_adapter.py"]
    # Y NO CORRE COMO ROOT. Verificado en el lab con el adapter real:
    # portal-check 14/14, y escribe politica.json y capacidades/pedidos.jsonl
    # igual (uid 10000 es el dueño de data/ y de politica/). De paso deja de
    # sembrar archivos de root adentro de data/, que es lo que rompio el primer
    # despliegue.
    user: "10000:10000"
    ports:
      # El puerto del host lo resuelve `nuevo-agente.sh` (es el del gateway + 1);
      # adentro del contenedor siempre es 8643.
      - "127.0.0.1:${PUERTO_ADAPTER}:8643"
    volumes:
      - ./data:/opt/data
      # El adapter SÍ escribe: es quien recibe el clic del cliente en el portal.
      - ./politica:/opt/politica
      # Las mismas skills del kit: el adapter las lista en la pestaña de
      # habilidades del portal, y sin este montaje desaparecerian de ahi.
      - ./kit-skills:/opt/kit/skills:ro
      # El codigo del adapter, de SOLO LECTURA: es lo que este contenedor
      # ejecuta, y no puede vivir en un lugar que el agente pueda escribir.
      - ./kit-adapter:/opt/kit/adapter:ro
      # El config del agente, de SOLO LECTURA: el adapter lo LEE (el modelo por
      # defecto, las skills apagadas, el preambulo) y no lo escribe nunca. Sin
      # esta linea lo tenia rw por el montaje de ./data, y era el segundo camino
      # para tocar algo que el motor lee con mas privilegio.
      - ./data/config.yaml:/opt/data/config.yaml:ro
    environment:
      - TZ=America/Montevideo
      # Las dos escrituras del loopback, por lo mismo que en el gateway: para el
      # browser `localhost:8090` y `127.0.0.1:8090` son orígenes distintos, y la
      # lista de los DOS servicios tiene que decir lo mismo o la mitad del
      # portal funciona y la otra mitad no.
      - PORTAL_CORS_ORIGINS=https://tuagente.uy,https://app.tuagente.uy,http://localhost:8090,http://127.0.0.1:8090
      # El nombre que el cliente ve en su portal. Si falta, dice "Agente".
      - AGENT_NAME=${AGENT_NAME}
    # LOS SECRETOS NO VIVEN EN data/, y es una cadena de escalada, no un gusto:
    # `data/` es del agente, este archivo es el env_file de los DOS servicios, y
    # con una variable como PYTHONPATH el agente ejecuta codigo suyo adentro de
    # este contenedor —medido— y de ahi llega a politica/ y al cont-init que s6
    # corre como root. Vive afuera, root:root 600, sin ningun montaje que lo
    # exponga al agente.
    env_file:
      - ./secretos.env

# secretos.env, en la raíz del agente (nunca se commitea, root:root 600):
#   API_SERVER_KEY=          openssl rand -hex 32, única por cliente
#   OPENROUTER_API_KEY=      o la del proveedor que uses
#   TELEGRAM_BOT_TOKEN=      de @BotFather
#   TELEGRAM_ALLOWED_USERS=  ids autorizados; sin esto le escribe cualquiera
#   SMTP_USER= / SMTP_APP_PASSWORD=   si manda mails
