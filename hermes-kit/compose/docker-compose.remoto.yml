# Igual que docker-compose.example.yml pero para una VPS, con TLS.
#
# LA DIFERENCIA QUE IMPORTA: acá los servicios del agente NO publican ningún
# puerto en el host. Ni 8642 ni 8643. Caddy los alcanza por la red interna de
# compose (por nombre de servicio), y es lo ÚNICO que escucha en la interfaz
# pública. Si mañana alguien escanea la IP, ve 443 y nada más.
#
# Es a propósito: `docker publish` abre el puerto SALTEANDO ufw/iptables —
# creer que el firewall te cubre y tener 8642 abierto al mundo es un clásico.
# Sin `ports:` no hay nada que saltear.
#
# Una VPS por cliente. Compartir caja entre clientes rompe justo lo que
# vendemos: Hermes EJECUTA CÓDIGO, y un contenedor no es un límite duro contra
# un agente al que le inyectaron instrucciones. A USD 4,59 el aislamiento sale
# casi gratis.
#
# LA VERSION VA FIJA, no `latest` (ver docker-compose.example.yml).

services:
  caddy:
    image: caddy:2-alpine
    container_name: ${CLIENTE}-caddy
    restart: unless-stopped
    ports:
      - "80:80"     # solo para el desafío de Let's Encrypt y el redirect a 443
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data      # los certificados: SI SE PIERDEN, se re-emiten y
      - caddy_config:/config  # Let's Encrypt tiene tope semanal. No borrar.
    environment:
      - DOMINIO_API=${DOMINIO_API}
      - DOMINIO_PORTAL=${DOMINIO_PORTAL}
      - EMAIL_TLS=${EMAIL_TLS}
    depends_on:
      - hermes
      - portal-adapter

  hermes:
    image: nousresearch/hermes-agent:v2026.7.30
    container_name: ${CLIENTE}-hermes
    restart: unless-stopped
    command: gateway run
    # SIN `ports:` — ver la nota de arriba. El dashboard (9119) queda adentro y
    # no lo alcanza nadie desde afuera, que es donde tiene que estar.
    expose:
      - "8642"
    volumes:
      - ./data:/opt/data
      # SOLO LECTURA, y es el punto entero: acá vive qué puede hacer el agente
      # con cada conexión. Si estuviera dentro de ./data podría editarlo con
      # write_file o por terminal, y un guardrail que el guardado puede
      # cambiar no es un guardrail.
      - ./politica:/opt/politica:ro
      # Las skills del kit, de SOLO LECTURA y fuera de ./data. El motor las
      # indexa igual (skills.external_dirs en config.yaml), pero el agente no
      # puede reescribirlas con skill_manage ni por terminal, y el curator
      # —que archiva a los 90 dias sin uso lo que toma por "creado por el
      # agente"— no las toca: una skill externa nunca es elegible.
      - ./kit-skills:/opt/kit/skills:ro
      # s6 corre esto antes del gateway, en cada arranque. Hoy traduce al
      # español el mensaje de pairing de Telegram, que viene hardcodeado en
      # run.py y le pide al cliente que corra un comando de terminal —
      # contradiciendo al portal, que le dice "pegá el código acá".
      - ./politica/cont-init-parches.sh:/etc/cont-init.d/03-parches:ro
      # LA MISMA IDEA, Y NOS FALTABA. config.yaml vive dentro de ./data y es
      # PROPIEDAD DEL AGENTE (-rw-r----- hermes hermes): verificado el 9/8/2026,
      # el agente lo escribe. Y ahí adentro están `disabled_toolsets` —donde
      # apagamos `cronjob` a propósito— y donde se registran los MCP. O sea que
      # podía devolverse cronjob y registrar un MCP salteando la guardia; solo
      # tenía que esperar un reinicio.
      #
      # EL ORDEN: se creía que en el PRIMER arranque había que levantar SIN esta
      # línea, porque Hermes escribe y migra el config solo. Con v2026.7.30 no
      # hace falta — verificado el 12/8/2026 sobre un agente creado de cero, que
      # arrancó bien con el archivo :ro desde el primer arranque.
      # Al SUBIR DE VERSIÓN del motor la precaución sigue valiendo: si la nueva
      # migra el config, hay que sacarla, arrancar, y volver a ponerla.
      #
      # Verificado: con el archivo :ro el gateway levanta en 18 s y
      # portal-check da 14 ok / 0 fallas.
      - ./data/config.yaml:/opt/data/config.yaml:ro
      # EL PLUGIN `promesas`, DE SOLO LECTURA. El motor busca los plugins del
      # usuario en HERMES_HOME/plugins (`hermes_cli/plugins.py:1369`), o sea
      # adentro de ./data, que es del agente: sin este montaje encima, el
      # agente puede borrar de un `rm` la guardia que le impide anunciar un
      # flujo que no creo. Es la misma razon por la que politica/ esta afuera.
      # Se prende con `plugins.enabled` en el config, que tambien es :ro.
      - ./politica/plugins:/opt/data/plugins:ro
    environment:
      - TZ=America/Montevideo
      # DASHBOARD APAGADO, y no es por ahorrar: con HERMES_DASHBOARD=1 el
      # dashboard bindearia 0.0.0.0 sin autenticacion, Hermes se niega —bien
      # hecho de su parte— y s6 lo reinicia en bucle.
      #
      # OJO, aca decia "en la Mac no se nota porque igual queda detras de
      # 127.0.0.1", y es FALSO: ese 127.0.0.1 es el mapeo del HOST; adentro del
      # contenedor el dashboard igual intenta 0.0.0.0 y el bucle es el mismo.
      # Medido el 12/8/2026 en un agente local: 27 reinicios y 216 lineas de log
      # por minuto, con `docker compose logs` inservible. La hipotesis costo
      # tres meses de plantilla de altas rota — el =0 vivio aca y nunca llego a
      # docker-compose.example.yml, que es la que copia nuevo-agente.sh.
      #
      # Nunca fue para el cliente: si hace falta mirarlo, se prende y se
      # entra por un tunel SSH, no publicandolo.
      - HERMES_DASHBOARD=0
      # El consentimiento de los hooks va ACA y no en el allowlist de data/:
      # ese vive en el volumen del agente, que lo puede borrar — y un hook sin
      # consentimiento no corre, o sea que la puerta queda abierta sin ruido.
      - HERMES_ACCEPT_HOOKS=1
      # EL PORTAL VIVE EN tuagente.uy/app, no en app.tuagente.uy — ese host
      # devuelve 404 y no lo usa nadie. Si acá va el origen equivocado, el
      # browser descarta TODAS las respuestas y el cliente ve "No pude conectar
      # con tu agente", que se lee como que el agente está caído. Verificado el
      # 10/8/2026 con East: los dos servicios respondían 200 por curl y el
      # portal no arrancaba. Se deja el viejo por si queda algún link.
      - API_SERVER_CORS_ORIGINS=https://tuagente.uy,https://app.tuagente.uy
    # LOS SECRETOS NO VIVEN EN data/, y es una cadena de escalada, no un gusto:
    # `data/` es del agente, este archivo es el env_file de los DOS servicios, y
    # con una variable como PYTHONPATH el agente ejecuta codigo suyo adentro de
    # este contenedor —medido— y de ahi llega a politica/ y al cont-init que s6
    # corre como root. Vive afuera, root:root 600, sin ningun montaje que lo
    # exponga al agente.
    env_file:
      - ./secretos.env
    deploy:
      resources:
        limits:
          memory: 3G      # medido: un agente pica en 1,1 GB. 3G deja aire y
          cpus: "2.0"     # todavía entra Caddy en una caja de 4 GB.

  portal-adapter:
    image: nousresearch/hermes-agent:v2026.7.30
    container_name: ${CLIENTE}-portal-adapter
    restart: unless-stopped
    # EL CODIGO DEL ADAPTER NO SALE DE data/. `data/` es del agente (la tiene rw y
    # adentro de su contenedor corre como root), asi que podia reescribir el
    # archivo que este servicio ejecuta. Ahora viene de kit-adapter/, montada :ro.
    #
    # QUE CIERRA Y QUE NO, para que nadie lea de mas: cierra que el agente elija
    # DIRECTAMENTE el codigo del adapter, y que ese codigo corra como root (ver
    # `user:`). NO cerraba, por si solo, el camino por el env_file: mientras los
    # secretos vivieron en `data/.env` —del agente— un `PYTHONPATH=/opt/data/...`
    # le hacia ejecutar codigo suyo ADENTRO de este contenedor igual, y desde ahi
    # llegaba a `politica/`: la puerta y el `cont-init` que s6 corre como root en
    # hermes. Medido con la imagen real. Por eso los secretos salieron de data/
    # (ver `env_file`): hacen falta LAS DOS cosas, y ninguna sirve sola.
    entrypoint: ["python3", "/opt/kit/adapter/portal_adapter.py"]
    # Y NO CORRE COMO ROOT. Verificado en el lab con el adapter real:
    # portal-check 14/14, y escribe politica.json y capacidades/pedidos.jsonl
    # igual (uid 10000 es el dueño de data/ y de politica/). De paso deja de
    # sembrar archivos de root adentro de data/, que es lo que rompio el primer
    # despliegue.
    user: "10000:10000"
    expose:
      - "8643"
    volumes:
      - ./data:/opt/data
      # El adapter SÍ escribe: es quien recibe el clic del cliente en el portal.
      - ./politica:/opt/politica
      # Las mismas skills del kit: el adapter las lista en la pestaña de
      # habilidades del portal, y sin este montaje desaparecerian de ahi.
      - ./kit-skills:/opt/kit/skills:ro
      # El codigo del adapter, de SOLO LECTURA: es lo que este contenedor
      # ejecuta, y no puede vivir en un lugar que el agente pueda escribir.
      - ./kit-adapter:/opt/kit/adapter:ro
      # El config del agente, de SOLO LECTURA: el adapter lo LEE (el modelo por
      # defecto, las skills apagadas, el preambulo) y no lo escribe nunca. Sin
      # esta linea lo tenia rw por el montaje de ./data, y era el segundo camino
      # para tocar algo que el motor lee con mas privilegio.
      - ./data/config.yaml:/opt/data/config.yaml:ro
    environment:
      - TZ=America/Montevideo
      - PORTAL_CORS_ORIGINS=https://tuagente.uy,https://app.tuagente.uy
      # El nombre que el cliente ve en su portal. Si falta, dice "Agente".
      - AGENT_NAME=${AGENT_NAME}
      # El adapter habla con el gateway por la red interna, no por localhost:
      # en esta topología no comparten host. La variable se llama
      # AGENT_API_BASE: hasta el 12/8/2026 acá decía `HERMES_ENDPOINT`, que no
      # la lee NADIE —ni el adapter ni el motor—. Andaba de casualidad, porque
      # el default del adapter es este mismo valor; el día que alguien la
      # apuntara a otro lado, la línea no iba a hacer nada y el adapter iba a
      # seguir hablándole a `hermes:8642` sin decir una palabra.
      - AGENT_API_BASE=http://hermes:8642
    # LOS SECRETOS NO VIVEN EN data/, y es una cadena de escalada, no un gusto:
    # `data/` es del agente, este archivo es el env_file de los DOS servicios, y
    # con una variable como PYTHONPATH el agente ejecuta codigo suyo adentro de
    # este contenedor —medido— y de ahi llega a politica/ y al cont-init que s6
    # corre como root. Vive afuera, root:root 600, sin ningun montaje que lo
    # exponga al agente.
    env_file:
      - ./secretos.env
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  caddy_data:
  caddy_config:

# .env al lado de este archivo (NUNCA se commitea):
#   CLIENTE=east
#   AGENT_NAME=Washi
#   DOMINIO_API=east.agentes.tuagente.uy
#   DOMINIO_PORTAL=east-portal.agentes.tuagente.uy
#   EMAIL_TLS=soporte@tuagente.uy      para los avisos de Let's Encrypt
#
# secretos.env, en la raíz del agente (tampoco se commitea, root:root 600):
#   API_SERVER_KEY=          openssl rand -hex 32, única por cliente
#   OPENROUTER_API_KEY=
#   TELEGRAM_BOT_TOKEN=
#   TELEGRAM_ALLOWED_USERS=
