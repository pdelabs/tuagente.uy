# Template for a client's agent. One agent per client: its own volume, its
# own key. Never share anything between clients.
#
# THE VERSION IS PINNED, never `latest`. With `latest`, a Nous push changes
# the engine for EVERY client overnight, with nobody pressing a button, and we
# find out from a ticket that starts failing. Verified on 5/8/2026: agents
# were running v2026.7.30 while `latest` was already two versions ahead.
#
# To upgrade: change the tag, `docker compose pull && up -d`, and run both
# checks (agent-check.py and portal-check.py) BEFORE calling it good. If
# something broke, roll back to the previous tag and that's it.
services:
  hermes:
    image: nousresearch/hermes-agent:v2026.7.30   # see the note above before bumping this
    container_name: ${CLIENT}-hermes
    restart: unless-stopped
    command: gateway run
    ports:
      # Loopback only: the portal reaches it through the adapter or a tunnel,
      # never by exposing the gateway to the internet.
      #
      # THE HOST PORT IS RESOLVED BY `new-agent.sh` (fourth argument, default
      # 8642); inside the container it is ALWAYS 8642, which is what the
      # config's `api_server.port` says and what the adapter looks up at
      # `http://hermes:8642`. This used to be a literal on both sides, and the
      # second agent on the same host was born asking for a taken port: since
      # container names DO distinguish themselves, the clash only showed up at
      # `up -d`, with the SOUL already written and the keys already loaded.
      - "127.0.0.1:${GATEWAY_PORT}:8642"   # API server
      # The dashboard (9119) is NOT published: it ships off (see
      # HERMES_DASHBOARD below). If it's ever needed, turn it on, publish this
      # line and go in through an SSH tunnel — never for the client.
      # - "127.0.0.1:9119:9119"
    volumes:
      - ./data:/opt/data
      # READ ONLY, and that's the whole point: this is where what the agent
      # can do with each connection lives. If it were inside ./data it could
      # be edited with write_file or from a terminal, and a guardrail the
      # agent's own save can change is not a guardrail.
      - ./policy:/opt/policy:ro
      # The kit's skills, READ ONLY and outside ./data. The engine indexes
      # them all the same (skills.external_dirs in config.yaml), but the agent
      # can't rewrite them with skill_manage or from a terminal, and the
      # curator —which archives after 90 days unused whatever it takes for
      # "created by the agent"— never touches them: an external skill is
      # never eligible.
      - ./kit-skills:/opt/kit/skills:ro
      # s6 runs this before the gateway, on every start. Today it translates
      # to Spanish Telegram's pairing message, which comes hardcoded in run.py
      # and asks the client to run a terminal command — contradicting the
      # portal, which tells them "paste the code here".
      #
      # THE FILE HAS TO EXIST BEFORE THE FIRST `up`: when Docker mounts
      # something that isn't there, it creates a DIRECTORY with that name, and
      # a directory at /etc/cont-init.d/ makes s6 not start anything at all.
      # `install.sh` puts it there, and it runs first — this line and that copy
      # travel together or not at all.
      #
      # When UPDATING it on an agent that's already running: `install.sh`
      # copies it with `cp`, which preserves the inode, so the container sees
      # the new file and a restart is enough. If you move it over with rsync
      # or mv —which replace the file— the mount is left with the old one:
      # that's when `docker compose up -d --force-recreate` is needed.
      - ./policy/cont-init-patches.sh:/etc/cont-init.d/03-patches:ro
      # Same idea, and we were missing it: config.yaml lives inside ./data and
      # is OWNED by the agent. Verified on 9/8/2026 — it does write it. That's
      # where `disabled_toolsets` lives (where we deliberately turn off
      # cronjob) and the MCP registry: cronjob could get itself turned back on
      # and skip the guard by waiting for a restart.
      # It used to be believed that the FIRST start had to happen WITHOUT this
      # line (Hermes writes and migrates the config) and add it afterward.
      # With v2026.7.30 that's not needed: verified on 12/8/2026 against an
      # agent created from scratch, which started fine with the file :ro from
      # the very first boot. When UPGRADING the engine's version, the caution
      # still holds: if the new one migrates the config, take the line out,
      # start once, and put it back.
      - ./data/config.yaml:/opt/data/config.yaml:ro
      # THE `promises` PLUGIN, READ ONLY. The engine looks for user plugins
      # under HERMES_HOME/plugins (`hermes_cli/plugins.py:1369`), i.e. inside
      # ./data, which belongs to the agent: without this mount on top, the
      # agent can `rm` away the guard that stops it from announcing a flow it
      # never created. It's the same reason policy/ lives outside.
      # It's turned on with `plugins.enabled` in the config, also :ro.
      - ./policy/plugins:/opt/data/plugins:ro
    environment:
      - TZ=America/Montevideo
      # DASHBOARD OFF. With =1 the engine tries to bind the dashboard on
      # 0.0.0.0:9119, gets refused because no auth provider is configured, s6
      # restarts it, and it starts over. Measured on a freshly started local
      # agent (12/8/2026, Docker Desktop on macOS): 27 restarts and 216 log
      # lines PER MINUTE, from a six-line block repeating itself.
      #
      # It doesn't break the agent: it breaks `docker compose logs`, which
      # during an onboarding is the only diagnostic tool there is. A real
      # ERROR buried under 216 lines of noise is an ERROR nobody sees.
      #
      # (For a while this said =1 here and =0 in the remote compose, with a
      # comment claiming "on the Mac it's not noticeable because it's behind
      # 127.0.0.1 anyway." That's false: 127.0.0.1 is the HOST mapping, and
      # inside the container the dashboard still tries 0.0.0.0. The loop is
      # identical.)
      - HERMES_DASHBOARD=0
      # Hook consent goes HERE and not in data/'s allowlist: that one lives in
      # the agent's volume, which it can delete — and a hook without consent
      # doesn't run, meaning the gate would stay open with no noise.
      - HERMES_ACCEPT_HOOKS=1
      # Without this the browser discards every response from the gateway.
      #
      # BOTH LOOPBACK SPELLINGS GO IN: `localhost` and `127.0.0.1` are
      # DIFFERENT origins to the browser, and the dev portal opens with either
      # one (the magic link we build for testing usually carries 127.0.0.1).
      # With only one, curl works —it doesn't send `Origin`— and the browser
      # doesn't: the classic "works over curl, doesn't work in the browser",
      # and it used to get fixed by hand on every onboarding, in both services.
      - API_SERVER_CORS_ORIGINS=https://tuagente.uy,https://app.tuagente.uy,http://localhost:8090,http://127.0.0.1:8090
    # SECRETS DO NOT LIVE IN data/, and it's an escalation chain, not a
    # preference: `data/` belongs to the agent, this file is the env_file for
    # BOTH services, and with a variable like PYTHONPATH the agent runs its
    # own code inside this container —measured— and from there reaches
    # policy/ and the cont-init that s6 runs as root. It lives outside,
    # root:root 600, with no mount that exposes it to the agent.
    env_file:
      - ./secrets.env
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"

  portal-adapter:
    image: nousresearch/hermes-agent:v2026.7.30   # see the note above before bumping this
    container_name: ${CLIENT}-portal-adapter
    restart: unless-stopped
    # THE ADAPTER'S CODE DOES NOT COME OUT OF data/. `data/` belongs to the
    # agent (it has it rw and inside its container it runs as root), so it
    # could rewrite the file this service runs. Now it comes from
    # kit-adapter/, mounted :ro.
    #
    # WHAT THIS CLOSES AND WHAT IT DOESN'T, so nobody reads too much into it:
    # it closes the path where the agent DIRECTLY picks the adapter's code,
    # and where that code runs as root (see `user:`). It did NOT close, on its
    # own, the env_file path: while secrets lived in `data/.env` —the agent's—
    # a `PYTHONPATH=/opt/data/...` made it run its own code INSIDE this
    # container all the same, and from there it reached `policy/`: the gate
    # and the `cont-init` that s6 runs as root on hermes. Measured against the
    # real image. That's why secrets moved out of data/ (see `env_file`):
    # BOTH things are needed, and neither one works alone.
    entrypoint: ["python3", "/opt/kit/adapter/portal_adapter.py"]
    # AND IT DOES NOT RUN AS ROOT. Verified in the lab with the real adapter:
    # portal-check 14/14, and it still writes policy.json and
    # capabilities/requests.jsonl fine (uid 10000 owns data/ and policy/).
    # As a side effect it stops seeding root-owned files inside data/, which
    # is what broke the first deployment.
    user: "10000:10000"
    ports:
      # The host port is resolved by `new-agent.sh` (it's the gateway's + 1);
      # inside the container it is always 8643.
      - "127.0.0.1:${ADAPTER_PORT}:8643"
    volumes:
      - ./data:/opt/data
      # The adapter DOES write: it's the one that receives the client's click
      # in the portal.
      - ./policy:/opt/policy
      # The same kit skills: the adapter lists them in the portal's skills
      # tab, and without this mount they'd disappear from there.
      - ./kit-skills:/opt/kit/skills:ro
      # The adapter's code, READ ONLY: it's what this container runs, and it
      # can't live somewhere the agent can write to.
      - ./kit-adapter:/opt/kit/adapter:ro
      # The agent's config, READ ONLY: the adapter READS it (the default
      # model, the disabled skills, the preamble) and never writes it.
      # Without this line it had it rw through the ./data mount, and it was
      # the second path to touch something the engine reads with more
      # privilege.
      - ./data/config.yaml:/opt/data/config.yaml:ro
    environment:
      - TZ=America/Montevideo
      # Both loopback spellings, for the same reason as the gateway: to the
      # browser `localhost:8090` and `127.0.0.1:8090` are different origins,
      # and the list on BOTH services has to say the same thing or half the
      # portal works and the other half doesn't.
      - PORTAL_CORS_ORIGINS=https://tuagente.uy,https://app.tuagente.uy,http://localhost:8090,http://127.0.0.1:8090
      # The name the client sees in their portal. If missing, it says "Agente".
      - AGENT_NAME=${AGENT_NAME}
    # SECRETS DO NOT LIVE IN data/, and it's an escalation chain, not a
    # preference: `data/` belongs to the agent, this file is the env_file for
    # BOTH services, and with a variable like PYTHONPATH the agent runs its
    # own code inside this container —measured— and from there reaches
    # policy/ and the cont-init that s6 runs as root. It lives outside,
    # root:root 600, with no mount that exposes it to the agent.
    env_file:
      - ./secrets.env

# secrets.env, at the agent's root (never committed, root:root 600):
#   API_SERVER_KEY=          openssl rand -hex 32, unique per client
#   OPENROUTER_API_KEY=      or whichever provider's you use
#   TELEGRAM_BOT_TOKEN=      from @BotFather
#   TELEGRAM_ALLOWED_USERS=  authorized ids; without this anyone can write to it
#   SMTP_USER= / SMTP_APP_PASSWORD=   if it sends mail
