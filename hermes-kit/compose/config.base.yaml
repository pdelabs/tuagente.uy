model:
  provider: openrouter
  api_key: ${OPENROUTER_API_KEY}
  default: openai/gpt-5.6-luna

api_server:
  enabled: true
  host: 0.0.0.0
  port: 8642
  key: ${API_SERVER_KEY}

# Native kanban tools. BOTH keys below are needed, and it's not guessable:
# `toolsets` opens the gate (check_fn), and `platform_toolsets` runs the
# per-platform filter. With only one, the agent sees no kanban tool at all and
# ends up improvising from a terminal. Verified on 4/8/2026.
toolsets:
  - kanban

# Tools a client agent never uses and whose schema gets paid for on EVERY call
# to the model. Measured with `hermes prompt-size` on a freshly created agent:
# the schemas weigh 67.6 KB (almost double the entire system prompt), and
# dropping these two brings it down to 60.0 KB with nothing lost.
#   tts        1.8 KB  speak out loud
#   delegation 5.8 KB  create sub-agents
# If a client ever needs them, take them off this list and restart.
# One gateway serving EVERY profile. Without this the inbound gateway handles
# only the active profile: a hired role installs fine, `hermes profile list`
# shows it, and /p/<rol>/ never answers -- hire-role.sh hangs forever on
# its "waiting" loop. Found the hard way on the first from-scratch team
# agent (2026-08-19); the lab only worked because the spike set it by hand.
gateway:
  multiplex_profiles: true

agent:
  # Effort at max. Tested on 5/8 against the same agent, same data and same
  # prompts: with the provider's default it left 3 out of 18 clients off a
  # roadmap while saying there were 18, mixed up months in a ranking, and got
  # a cascading bonus wrong. With `max` all three came out right the first
  # time. Cost: noise (USD 0.18 for 13 full sessions).
  # WATCH OUT: it doesn't fix complacency — even with max it still accused
  # itself of inventing someone who was right there in its own SOUL.
  reasoning_effort: max
  disabled_toolsets:
    - tts
    - delegation
    # WATCH OUT: the browser does NOT get turned off from here. That goes
    # through `platform_toolsets`, below, and the why is explained there:
    # putting it on this list also takes down `web_search`.
    # cronjob turned off ON PURPOSE, and not to save context: it's what pushes
    # the agent toward the `flow` skill instead of improvising a loose cron.
    # Verified on 8/8: a client asked "I want regular updates on the
    # competition," the agent LOOKED at the flow skill (skill_view) and still
    # called `cronjob` directly. Out came an invisible cron —no folder, no
    # FLOW.md, no Flujos tab— and on top of that with `deliver=origin`, which
    # delivers to the portal session: it was going to run every Monday and
    # never deliver anything to anyone, with no notice at all. With the
    # toolset off the only easy path is `create_flow.py`, which creates the
    # cron with --deliver=local and leaves the flow visible. It's not a wall:
    # it can still be done from a terminal, and that's the SOUL's job. It's
    # removing the easy door that opened onto the wrong place.
    - cronjob

# THE BROWSER IS REMOVED BY INCLUSION, NOT BY `disabled_toolsets`. The
# difference isn't stylistic: `disabled_toolsets` subtracts the toolset's
# STATIC CATALOG at the very end (model_tools.py:410-441, "even if a composite
# toolset is enabled, any tools belonging to a disabled toolset are strictly
# stripped out"), and `browser`'s catalog includes `web_search`
# (toolsets.py:199-207). So turning off browser that way also turns off web
# search, even though `web_search` belongs to the `web` toolset. Measured with
# the image's own interpreter, the way the engine actually calls it
# (agent/agent_init.py:1390, with enabled AND disabled), all three rows in ONE
# single run and with a search credential present so `check_web_api_key`
# doesn't mask the result:
#
#   bundle (browser included)             → 36 tools · browser 9 · web_search YES
#   bundle + disabled_toolsets:[browser]  → 26 tools · browser 0 · web_search NO
#   explicit list without browser         → 27 tools · browser 0 · web_search YES
#
# By name, which is what doesn't come apart: (bundle − explicit) = the 9
# browser_*, and (explicit − bundle) = nothing; (explicit − disabled) =
# web_search.
#
# We want `web_search`: the client does competitor monitoring and is likely to
# add a search key.
#
# ALL THREE PLATFORMS CARRY THE SAME LIST. The same agent handles the portal,
# Telegram and the cron flows: a browser that returns blank pages fails the
# same way on all three, and on the cron on top of that with nobody watching.
# Also, the old telegram and cron declarations DID NOTHING AT ALL: a list that
# only names bundles and `kanban` doesn't mention any configurable toolset, so
# the engine never enters explicit mode and falls back to the default —
# everything on, including browser, `clarify` and `computer_use`. Verified:
# removing those keys gave exactly the same result as leaving them.
#
# Deliberate differences from that default: `clarify` is also removed (asking
# through a UI — the portal never had one, the cron turns it off on its own,
# and the agent asks by writing) and `computer_use` (operating a computer,
# whose skill we already turn off).
#
# THIS LIST IS GENERATED, never written from memory — bumping the engine's tag
# can add or rename toolsets and this goes stale silently:
#   python3 tools/skills-knob.py --toolsets --image <tag>
# `agent-check.py` compares all three against this and fails if they differ.
platform_toolsets:
  api_server:
    - bfl
    - code_execution
    - file
    - image_gen
    - kanban
    - memory
    - session_search
    - skills
    - terminal
    - todo
    - vision
    - web
  telegram:
    - bfl
    - code_execution
    - file
    - image_gen
    - kanban
    - memory
    - session_search
    - skills
    - terminal
    - todo
    - vision
    - web
  cron:
    - bfl
    - code_execution
    - file
    - image_gen
    - kanban
    - memory
    - session_search
    - skills
    - terminal
    - todo
    - vision
    - web

# THE MUTATION VERIFIER, OFF. When a write_file or a patch fails and doesn't
# retry cleanly, the engine STAPLES a line onto the agent's response like
#   "⚠️ File-mutation verifier: 1 file(s) were NOT modified this turn…
#    /tmp/design-kit-instagram.md — Write denied… outside HERMES_WRITE_SAFE_ROOT"
# The client reads that in their portal: machine vocabulary, a host path and
# the name of an environment variable. It's exactly what the SOUL forbids the
# agent from doing ("talk about the work, not the machine"), and the engine
# does it anyway, on top, with no way for the agent to prevent it. Seen with
# Mr.Wobble on 12/8. The attempt failing is fine and needs fixing; telling the
# client about it like that is not. Knob: hermes_cli/config_defaults.py:1051,
# read in run_agent.py:3300.
display:
  file_mutation_verifier: false

# THE GATE, IN CODE AND NOT IN PROSE. The engine runs these scripts BEFORE the
# tool and, if they answer {"action":"block"}, doesn't run it and hands the
# message back to the model (agent/shell_hooks.py; registered in
# gateway/run.py:10499). Covers the three things QA saw or left open:
# installing software on the client's volume, signing a comment as `portal`
# (i.e. forging an approval), and unblocking its own ticket.
#
# Consent goes HERE and in the compose (HERMES_ACCEPT_HOOKS=1), NEVER through
# data/'s allowlist: that one lives in the volume and the agent can delete it,
# and a hook with no consent FAILS OPEN.
#
# WATCH OUT: the hook fails open by design (if the script crashes or the
# timeout expires, the tool runs anyway with a logger.warning nobody watches).
# That's why `agent-check.py` checks that it's declared, that the script
# exists, that it's executable, and that it actually blocks.
#
# AND IT'S NOT THEORETICAL: on 13/8/2026, with the machine under load, this
# was measured:
#   WARNING agent.shell_hooks: shell hook timed out after 25.54s
#           (event=pre_tool_call command=/opt/policy/hooks/gate.py)
# with `timeout: 10` declared. `agent/shell_hooks.py:509-515` returns None and
# the tool runs. In other words: under load the gate stops being a gate,
# silently. That's why `gate.py` imports nothing expensive and never touches
# the network — the faster it returns, the fewer windows like this there are.
# The real fix is upstream.
hooks_auto_accept: true
hooks:
  pre_tool_call:
    - matcher: "terminal"
      command: "/opt/policy/hooks/gate.py"
      timeout: 10
    # execute_code was NOT covered, and that's how the deletion the client had
    # rejected got through: the agent didn't use the terminal, it used this
    # one. Same power under a different name (runs Python inside the volume),
    # so it gets the same gate.
    - matcher: "execute_code"
      command: "/opt/policy/hooks/gate.py"
      timeout: 10
    - matcher: "kanban_unblock"
      command: "/opt/policy/hooks/gate.py"
      timeout: 10

# THE PROMISES GUARD. A shell hook was NOT enough: `shell_hooks.py` can only
# return `block`, `continue` or `context` — none of which can touch the
# response's text — and `pre_verify`, which would be the place to make it
# retry, only fires if the turn edited files
# (conversation_loop.py:6808-6815). The turn with the bug wrote nothing: it
# looked at two skills and answered "Queda definido: viernes a las 9:30"
# without creating any flow. `transform_llm_output` is the only point that
# sees the final response BEFORE it gets saved and sent
# (turn_finalizer.py:485-505), and it's plugin-based.
#
# User plugins are opt-in: without this list the engine discovers it and
# doesn't load it (plugins.py:1471-1487). The code lives in policy/plugins/,
# mounted :ro over /opt/data/plugins.
plugins:
  enabled:
    - promises

# SELF-IMPROVEMENT: every 25 turns, not every 10. The fork that writes skills
# fires on work VOLUME, not quality (turn_finalizer.py:633-637), so the more
# an agent suffers from not having the right tool, the more likely it is to
# canonize the suffering — that's the mechanical cause behind the skill that
# fixed "draw the SVG by hand" as a method. It doesn't get turned off: it's
# the only signal we have that a production agent is missing something. It
# gets bounded and harvested instead.
# The key has no default declared in config_defaults.py: it lives as the
# .get(..., 10) in agent_init.py:1706-1710, so a version bump can change the
# number without anything failing.
# THE PORTAL'S PREAMBLE. Without this, the engine stuffs into the agent —on
# every api_server session, 200 lines AFTER the SOUL— a paragraph saying "the
# rendering layer is unknown, assume plain text, no markdown formatting" and
# explaining the MEDIA tags, with absolute host paths
# (hermes:agent/prompt_builder.py:912-923). Both things are false in our
# portal, which renders full markdown with Markdown.tsx and turns paths and
# ids into clickable chips. `replace` swaps it out entirely; `append` would
# leave it and add this alongside it (hermes:agent/system_prompt.py:73-119).
#
# The model reads this text: written with the same care as the SOUL.
platform_hints:
  api_server:
    replace: |
      Estás respondiendo dentro del portal de tu cliente, en el navegador.

      Se renderiza markdown completo: encabezados, listas, tablas, bloques de
      código, fórmulas y diagramas mermaid. Usalo cuando ayude a leer, no para
      adornar: una respuesta de dos líneas sigue siendo dos líneas.

      Los ids de ticket (t_...), los artefactos (art_...) y las rutas que
      arrancan en workspace/ se convierten solos en algo que se abre de un
      click. Nombralos tal cual, sin adornarlos.

      Nunca escribas rutas absolutas del sistema ni etiquetas MEDIA:. No se
      renderizan, y una ruta absoluta muestra las tripas del servidor sin
      ayudar a nadie: la ruta desde workspace/ ya alcanza.

# Without `platforms.telegram.enabled` the Telegram adapter boots halfway:
# it logs "Connecting" but polling never starts and messages never arrive
# (discovered on 7/8/2026 with East: /start with no reply, zero errors).
# home_channel starts out pointed at support; it gets switched to the
# client's chat once pairing happens.
# THE AUTOMATIC DECOMPOSER, OFF. It corrupted an approval in QA and the chain
# is measured end to end: the client approved WITH A CORRECTION ("20, not 8,
# and for Thursday"), the second re-block for the same reason sent the ticket
# to `triage` (BLOCK_RECURRENCE_LIMIT = 2, hardcoded), the dispatcher sweeps
# triage on every tick and calls the decomposer, and the decomposer builds its
# prompt from TITLE AND BODY ONLY (kanban_decompose.py:306-312). Comments
# don't travel — and the client's correction lives in a comment, because a
# blocked ticket's body can't be rewritten from outside. Out came two child
# tasks asking for the old 8, and the portal asking to approve the wrong
# number a third time. With email connected, the supplier would have received
# 8.
#
# No skill or script in the kit uses `decompose`, and the engine re-reads the
# knob on every tick: no restart needed. Tested in the lab: with this off, a
# ticket that lands in triage no longer splits (0 children against 2).
kanban:
  auto_decompose: false

platforms:
  telegram:
    enabled: true
    home_channel:
      platform: telegram
      chat_id: 'FILL_IN_CHAT_ID'
      name: FILL_IN_NAME
      user_id: 'FILL_IN_CHAT_ID'

# THE CURATOR IS OFF, and on a team agent that is not tidiness. It runs by
# itself every 7 days, marks a skill stale at 30 days without use and ARCHIVES
# it at 90 -- it moves the directory into skills/.archive/ (notes/
# engine-knobs.md:370-388, VERIFIED against the engine's own defaults).
#
# The kit's own skills are already out of reach: they are mounted read only
# through `skills.external_dirs`, and an external path is never curation
# eligible. The craft skills of a hired role are NOT: `hermes profile install`
# leaves them in data/profiles/<rol>/skills/, which is the agent's, writable,
# and looks agent-created to the engine -- and on a team agent that is the ONLY
# copy of `brand-kit` or `post-image` anywhere. A client who hires marketing and
# then has a quiet quarter would find the craft gone from the index, archived,
# with no error anywhere: exactly what the client is paying for.
#
# The same notes lists `hermes curator pin <skill>` as the other way to close
# it; a pin is per skill and per agent, so it has to be repeated on every hire
# and nothing checks it was. The switch is one line and holds for every role
# hired from here on. What we lose is the stale/archive housekeeping of the
# skills the AGENT writes for itself, which is worth strictly less than the
# skills the client is paying for.
curator:
  enabled: false

# <<< generated by tools/skills-knob.py — do not hand-edit
#   source: the skills the engine ships installed
#   disabled: 66 · enabled: docx, ocr-and-documents, pdf, xlsx
#
# Regenerate when bumping the engine's tag:
#   python3 tools/skills-knob.py --image <tag> --apply compose/config.base.yaml
#
# A business agent doesn't send mail on its own (himalaya), doesn't post
# (xurl), doesn't run anyone's smart home, and doesn't know how to operate its
# own engine (hermes-agent, computer-use, claude-code). Each of those is
