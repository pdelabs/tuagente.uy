# Service to add to the client's docker-compose.yml when they ask for WhatsApp.
# It does NOT go in the base image: whatsmeow reverse-engineers the WhatsApp
# Web protocol and violates Meta's terms. Nobody carries that unless they
# asked for it and know the risk.
#
# The agent does NOT talk to this service: it talks to the guard, and the
# guard is the only thing that reaches this far. That's why the port isn't
# published to the host.
  # The service name and port are NOT decorative: the adapter reaches it at
  # http://whatsapp-bridge:8080 (its default, portal_adapter.py's
  # WHATSAPP_BRIDGE). This template used to say whatsapp-mcp:8590 and a ghcr
  # image that doesn't exist: three different names for the same thing, none
  # of them real.
  whatsapp-bridge:
    # Image we build ourselves from bridge/Dockerfile.bridge (whatsmeow
    # patched and audited). For a REMOTE agent it has to be pushed first to a
    # registry of ours; today it lives locally on the lab Mac.
    image: tuagente/whatsapp-bridge:audited
    container_name: ${CLIENT}-whatsapp-bridge
    restart: unless-stopped
    volumes:
      # The client's message history. Always inside THEIR volume.
      - ./data/connections/whatsapp:/app/store
    environment:
      - TZ=America/Montevideo
    # No `ports`: reachable only from the compose's internal network.
    expose:
      - "8080"
