# ONE CLIENT'S AGENT. The lab compose (`docker-compose.yml`) is the demo agent
# plus the trace viewer; this one is the shape every real agent runs in: one
# container, one folder under `instances/<name>/` with its SOUL, identity,
# secrets, state and workspace.
#
#   docker compose -p <name> -f engine/instance.yml \
#       --env-file engine/instances/<name>/instance.env up -d --build
#
# `instance.env` sets INSTANCE (the folder name), the two host ports and the
# portal origins. Traces go to the lab's Phoenix on the host when
# CORE_OTEL_ENDPOINT is set there; empty means no traces.
services:
  core:
    build: .
    container_name: tuagente-${INSTANCE}
    user: "10000:10000"
    env_file: ./instances/${INSTANCE}/secrets.env
    environment:
      CORE_MODEL: ${CORE_MODEL:-openrouter:openai/gpt-5.6-luna}
      CORE_CORS_ORIGINS: ${CORE_CORS_ORIGINS:-http://localhost:8090,http://127.0.0.1:8090}
      CORE_PLUGINS: ${CORE_PLUGINS:-approval,memory,image,social}
      TZ: America/Montevideo
      DELIVERABLES_DIR: /workspace/entregables
      CORE_OTEL_ENDPOINT: ${CORE_OTEL_ENDPOINT:-}
      CORE_OTEL_INCLUDE_CONTENT: ${CORE_OTEL_INCLUDE_CONTENT:-0}
      CORE_OTEL_SERVICE: tuagente-${INSTANCE}
    ports:
      - "127.0.0.1:${PORT_GATEWAY}:8643"
      - "127.0.0.1:${PORT_ADAPTER}:8643"
    volumes:
      - ./instances/${INSTANCE}/state:/state
      - ./instances/${INSTANCE}/workspace:/workspace
      - ./instances/${INSTANCE}/agent:/agent:ro
      - ../kit/plugins:/opt/kit/plugins:ro
      - ../kit/plugins/deliverable/skills/deliverable:/opt/kit/skills/deliverable:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
