[project]
name = "tuagente-core"
version = "0.1.0"
description = "The tuagente.uy agent engine: the portal served by Pydantic AI"
requires-python = ">=3.12"
dependencies = [
    # The `openrouter` extra exists for 2.43.0 (checked against PyPI metadata).
    "pydantic-ai-slim[openrouter]==2.43.0",
    # The `memory` plugin's capability: the notebook, its four tools and the
    # bounded injection. Pinned, like the engine it plugs into — the harness is
    # on 0.x and says so, and its API moves between minor releases.
    "pydantic-ai-harness==0.31.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-frontmatter>=1.1",
    "httpx>=0.27",
    # Traces to Phoenix (core/tracing.py): plain OpenTelemetry plus the
    # processor that rewrites Pydantic AI's GenAI attributes into the
    # OpenInference ones Phoenix renders. No Logfire.
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "openinference-instrumentation-pydantic-ai>=0.1.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "server"]
