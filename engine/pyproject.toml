[project]
name = "tuagente-core"
version = "0.1.0"
description = "The tuagente.uy agent engine: the portal served by Pydantic AI"
requires-python = ">=3.12"
dependencies = [
    # The `openrouter` extra exists for 2.43.0 (checked against PyPI metadata).
    "pydantic-ai-slim[openrouter]==2.43.0",
    # The `memory` plugin's capability: the notebook, its four tools and the
    # bounded injection. Pinned, like the engine it plugs into — the harness is
    # on 0.x and says so, and its API moves between minor releases.
    "pydantic-ai-harness==0.31.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-frontmatter>=1.1",
    # The clock (core/flows.py, core/scheduler.py): what a cron expression's
    # next occurrence is, and how close together two of them can be. Pinned —
    # the schedule of every client's flow is read through it.
    "croniter==6.0.0",
    "httpx>=0.27",
    # The social plugin's `place_image` (kit/plugins/social/core/stamp.py): the
    # brand's own pictures are COMPOSITED onto a slide, never drawn by the
    # image model, and this is what opens, resizes and pastes them. The API it
    # uses — open, convert, resize, paste with an alpha mask, save — has not
    # moved in a decade, so the floor is a floor and not a pin.
    "pillow>=11",
    # The social plugin's `publish_instagram`
    # (kit/plugins/social/core/instagram.py): Instagram fetches the pictures
    # itself and only takes PUBLIC URLs, so the slides go to a Cloudflare R2
    # bucket for the length of the publish and are deleted on the way out. R2
    # is S3-compatible and this is the S3 client; a floor, not a pin, because
    # the four calls used here — client, put_object, delete_objects — are the
    # oldest surface boto3 has.
    "boto3>=1.35",
    # Traces to Phoenix (core/tracing.py): plain OpenTelemetry plus the
    # processor that rewrites Pydantic AI's GenAI attributes into the
    # OpenInference ones Phoenix renders. No Logfire.
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "openinference-instrumentation-pydantic-ai>=0.1.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "server"]
