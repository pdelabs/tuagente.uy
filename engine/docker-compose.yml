services:
  core:
    build: .
    container_name: tuagente-core
    user: "10000:10000"
    env_file: ./secrets.env
    environment:
      CORE_MODEL: openrouter:openai/gpt-6-luna
      CORE_CORS_ORIGINS: http://localhost:8090,http://127.0.0.1:8090
      TZ: America/Montevideo
      # Passthroughs so `CORE_COMPACT_AT_TOKENS=6000 docker compose up -d`
      # lowers the compaction threshold for the gate without editing this file.
      CORE_COMPACT_AT: ${CORE_COMPACT_AT:-0.6}
      CORE_COMPACT_AT_TOKENS: ${CORE_COMPACT_AT_TOKENS:-60000}
      # Same idea for the flows' floor: `tests/test_flows.sh` brings the
      # container up with 1 so a minute-by-minute flow is legal for the length
      # of the test, and puts the 5 back on the way out.
      CORE_FLOWS_MIN_MINUTES: ${CORE_FLOWS_MIN_MINUTES:-5}
      # And for how long a delegation may run before the face is told it did
      # not make it: `tests/test_delegation.py` brings the container up with 5
      # so a timeout happens on purpose, and puts the fifteen minutes back. The
      # number is the creator's own default, repeated here because this line
      # OVERRIDES it: without it the passthrough has nothing to pass.
      CORE_DELEGATION_TIMEOUT: ${CORE_DELEGATION_TIMEOUT:-900}
      # Traces to the phoenix service below. This is the LAB compose, so the
      # content travels; a client's compose sets INCLUDE_CONTENT to 0 or
      # leaves the endpoint empty.
      CORE_OTEL_ENDPOINT: http://phoenix:6006/v1/traces
      CORE_OTEL_INCLUDE_CONTENT: "1"
      # THE MAILBOX IS THE STUB BELOW, and these are written out instead of
      # passed through on purpose: the lab's inbox is `greenmail`, never a real
      # account. A real mailbox is an INSTANCE's `secrets.env`
      # (`engine/instances/<name>/`), which is the only place a client's
      # credential ever lives.
      # The LOGIN, which on a real provider is the whole address and on
      # GreenMail is the local part: it creates `agente@lab.test` and
      # authenticates `agente`. `EMAIL_FROM` below is the address.
      EMAIL_ADDRESS: agente
      EMAIL_PASSWORD: secret
      EMAIL_IMAP_HOST: greenmail:3143
      EMAIL_SMTP_HOST: greenmail:3025
      EMAIL_FROM: agente@lab.test
      EMAIL_FOLDER: INBOX
      # No TLS anywhere: GreenMail's test ports speak plain IMAP and SMTP. It
      # is a VARIABLE and not a rule about the host name — a rule that reads
      # the host is a rule that one day lets a real mailbox through in the
      # clear (`kit/plugins/mail/core/mail_imap.py`).
      EMAIL_TLS: "0"
    # One app, two bases: the portal's `endpoint` (/api/*) and its `adapter`
    # (/portal/*) are the same container.
    ports:
      - "127.0.0.1:8642:8643"
      - "127.0.0.1:8643:8643"
    volumes:
      - ./state:/state
      - ./workspace:/workspace
      - ./agent:/agent:ro
      - ../kit/plugins:/opt/kit/plugins:ro
    restart: unless-stopped

  # THE MAILBOX THE LAB READS AND WRITES: a whole SMTP+IMAP server in one
  # container, with no state that outlives it. `greenmail.setup.test.all` is
  # what puts SMTP on 3025 and IMAP on 3143, in the clear, and `greenmail.users`
  # is what makes `agente@lab.test` a real account with a password — without it
  # the users are created on the fly and `smtplib.login()` has nothing to log
  # into. `cliente@lab.test` is the other side of every test: it writes to the
  # agent and reads what the agent answered.
  #
  # A PLAIN SERVICE AND NOT A `test` PROFILE. The lab runs the `mail` plugin, so
  # the agent's inbox has to be there whenever the agent is — a profile would
  # make `docker compose up -d` bring up an agent whose mailbox refuses the
  # connection, which is a failure nobody asked for.
  greenmail:
    image: greenmail/standalone:2.0.1
    container_name: tuagente-core-greenmail
    environment:
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.all
        -Dgreenmail.hostname=0.0.0.0
        -Dgreenmail.users=agente:secret@lab.test,cliente:secret@lab.test
        -Dgreenmail.verbose
    # Loopback only, like everything else here: the ports are for looking at
    # the stub by hand, the agent reaches it by service name on the compose's
    # own network.
    ports:
      - "127.0.0.1:3025:3025"
      - "127.0.0.1:3143:3143"
    restart: unless-stopped

  # The trace viewer: http://127.0.0.1:6006. Loopback only, never 0.0.0.0.
  # Receives OTLP over HTTP on the same port and keeps its data in ./state.
  phoenix:
    image: arizephoenix/phoenix:latest
    container_name: tuagente-core-phoenix
    ports:
      - "127.0.0.1:6006:6006"
    environment:
      PHOENIX_WORKING_DIR: /data
    volumes:
      - ./state/phoenix:/data
    restart: unless-stopped
