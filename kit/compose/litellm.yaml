# OpenAI-compatible proxy Hermes uses as `model.base_url` when observability
# is turned on. Forwards everything to OpenRouter and sends the traces to
# Phoenix.

model_list:
  # Wildcard: Hermes sends whatever model it has configured (e.g.
  # `openai/gpt-5.6-luna`) and this routes it straight to OpenRouter as-is,
  # with no need to enumerate models or touch this every time the default
  # changes.
  - model_name: "*"
    litellm_params:
      model: openrouter/*
      api_key: os.environ/OPENROUTER_API_KEY

litellm_settings:
  # THE AGENT ANSWERED NOTHING WITHOUT THIS. Hermes sends `reasoning_effort`
  # on every request; litellm validates parameters against what the provider
  # declares and returns HTTP 400 instead of dropping the one that doesn't
  # fit:
  #
  #   litellm.UnsupportedParamsError: openrouter does not support parameters:
  #   ['reasoning_effort'], for model=hermes-agent
  #
  # It's not a bug in the client or the model: it's the proxy planting itself
  # in the middle. And it doesn't fail sometimes, it fails ALWAYS — the whole
  # chat goes mute. Measured on 16/8 while resetting Mr.Wobble, on the first
  # "hola" after the reset.
  #
  # `drop_params` makes the parameter the provider doesn't understand get
  # dropped and the call go through anyway. Same rule as the one below:
  # observability got in the way of inference, so it can never be the thing
  # that cuts it off. An agent that answers a bit differently is a problem;
  # one that returns 400 to everything is not an agent.
  drop_params: true
  # Sends prompts, responses, tokens and cost to Phoenix over OTLP.
  # Phoenix for the traces, and ours for the COST. The second one exists
  # because putting this proxy in the middle forced `provider: custom` in
  # Hermes, and that path is wired to "I don't know the price": the Usage tab
  # went to $0. litellm does know the real number, so it logs it and the
  # adapter reads it.
  callbacks: ["arize_phoenix", "litellm-cost.cost_logger"]
  # If the callback fails, the call to the model STILL GOES THROUGH:
  # observability can never take the agent down. That's the difference
  # between a tool of ours and a point of failure for the client.
  turn_off_message_logging: false

general_settings:
  # No master_key on purpose: it only listens on compose's internal network,
  # with no port published. Adding a key here would just be one more
  # credential to rotate without closing any door that isn't already closed.
  telemetry: false
