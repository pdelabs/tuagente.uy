# Collector between litellm and Phoenix. It exists because of two things
# litellm gets wrong for this use case that can't be configured on its side:
#
# 1. IT SENDS THREE SPANS PER CALL. `litellm_proxy_request` and
#    `litellm_request` carry the SAME attributes: one of the two is
#    redundant. The third, `raw_gen_ai_request`, looked empty because it uses
#    `llm.openrouter.*` and Phoenix doesn't understand it — but it's the ONLY
#    one that carries the FULL PAYLOAD, system prompt included. And that
#    matters: litellm's library does NOT record the system message in
#    `llm.input_messages`, so in the "nice" span the SOUL is nowhere to be
#    found. Verified on 11/8: 36,746 characters of system prompt, the whole
#    SOUL, invisible there. That's why it doesn't get dropped: it gets
#    renamed and given the payload where it can be read.
# 2. IT DOESN'T SET `openinference.span.kind`. Without that attribute Phoenix
#    marks the span UNKNOWN and doesn't render the messages or enable the
#    playground, even though the content is all there.
#
# Here is where the noise gets dropped and what's missing gets added.

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  # Out with the noise: the duplicates and the proxy's plumbing spans.
  filter/noise:
    error_mode: ignore
    traces:
      span:
        - 'name == "litellm_proxy_request"'
        - 'IsMatch(name, "^(auth|POST|GET) ")'

  # What turns an opaque span into something Phoenix knows how to show.
  transform/openinference:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          - set(attributes["openinference.span.kind"], "LLM")
          - set(attributes["llm.model_name"], "${env:MODEL}") where attributes["llm.model_name"] == nil
          - set(attributes["llm.provider"], "openrouter") where attributes["llm.provider"] == nil
          # The default name (`litellm_request`) says nothing in a list of a
          # hundred. With the model up front it reads at a glance.
          - set(name, Concat(["chat ", "${env:MODEL}"], "")) where name == "litellm_request"
          # The raw one: what ACTUALLY travels, system prompt included. Copied
          # to input.value so Phoenix shows it as text.
          - set(attributes["input.value"], attributes["llm.openrouter.messages"]) where name == "raw_gen_ai_request"
          - set(attributes["output.value"], attributes["llm.openrouter.stringified_raw_response"]) where name == "raw_gen_ai_request"
          - set(name, "full payload (with the system prompt)") where name == "raw_gen_ai_request"

  batch:
    timeout: 2s

exporters:
  otlphttp/phoenix:
    endpoint: http://phoenix:6006
    tls:
      insecure: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [filter/noise, transform/openinference, batch]
      exporters: [otlphttp/phoenix]
