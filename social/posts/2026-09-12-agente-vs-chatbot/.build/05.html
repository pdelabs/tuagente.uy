<!doctype html><html lang="es"><head><meta charset="utf-8"><style>/* Shared tokens for every Instagram template. file:///Users/luisgurmendez/Desktop/Luis/Projects/tuagente.uy/social is replaced by
   render.mjs with the absolute file:// URL of the social/ directory. */
@font-face {
  font-family: "Jakarta";
  src: url("file:///Users/luisgurmendez/Desktop/Luis/Projects/tuagente.uy/social/fonts/PlusJakartaSans-Variable.ttf") format("truetype");
  font-weight: 200 800;
  font-style: normal;
}

:root {
  --primary: #5b4be8;
  --primary-dark: #3a2ed0;
  --ink: #14131f;
  --ink-soft: #4b4a5c;
  --surface: #fbfaff;
  --green: #00a67e;
  --coral: #ff7a59;
  --amber: #f0b429;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 1080px;
  height: 1350px;
  overflow: hidden;
  font-family: "Jakarta", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
body.fmt-square, body.fmt-square html { height: 1080px; }
body.fmt-story { height: 1920px; }

/* Themes: bg, fg, muted, accent (for <em>), pill, card */
body.theme-violet {
  --bg: linear-gradient(135deg, #5b4be8 0%, #4436c9 55%, #14131f 130%);
  --fg: #fff; --muted: rgba(255,255,255,.72); --accent: #cff3e4;
  --pill-bg: rgba(255,255,255,.14); --pill-fg: #fff;
  --card-bg: #fff; --card-fg: #14131f; --card-muted: #4b4a5c; --bubble: #f3f1ff;
  --hair: rgba(255,255,255,.18);
}
body.theme-ink {
  --bg: #161522;
  --fg: #fff; --muted: rgba(255,255,255,.62); --accent: #b8adff;
  --pill-bg: rgba(255,255,255,.1); --pill-fg: #fff;
  --card-bg: #fff; --card-fg: #14131f; --card-muted: #4b4a5c; --bubble: #f3f1ff;
  --hair: rgba(255,255,255,.14);
}
body.theme-light {
  --bg: #fbfaff;
  --fg: #14131f; --muted: #4b4a5c; --accent: #5b4be8;
  --pill-bg: rgba(91,75,232,.1); --pill-fg: #5b4be8;
  --card-bg: #fff; --card-fg: #14131f; --card-muted: #4b4a5c; --bubble: #fbfaff;
  --hair: rgba(20,19,31,.08);
}
body.theme-tonal-violet {
  --bg: #eae6ff; --fg: #241663; --muted: rgba(36,22,99,.72); --accent: #5b4be8;
  --pill-bg: rgba(255,255,255,.6); --pill-fg: #241663;
  --card-bg: #fff; --card-fg: #14131f; --card-muted: #4b4a5c; --bubble: #f3f1ff;
  --hair: rgba(36,22,99,.12);
}
body.theme-tonal-green {
  --bg: #cff3e4; --fg: #0b3b2c; --muted: rgba(11,59,44,.72); --accent: #007a5c;
  --pill-bg: rgba(255,255,255,.6); --pill-fg: #0b3b2c;
  --card-bg: #fff; --card-fg: #14131f; --card-muted: #4b4a5c; --bubble: #f0faf6;
  --hair: rgba(11,59,44,.12);
}
body.theme-tonal-coral {
  --bg: #ffdfd6; --fg: #4a1405; --muted: rgba(74,20,5,.72); --accent: #d9451f;
  --pill-bg: rgba(255,255,255,.6); --pill-fg: #4a1405;
  --card-bg: #fff; --card-fg: #14131f; --card-muted: #4b4a5c; --bubble: #fff4f0;
  --hair: rgba(74,20,5,.12);
}
body.theme-tonal-amber {
  --bg: #fbeecb; --fg: #4a3608; --muted: rgba(74,54,8,.72); --accent: #9a6b00;
  --pill-bg: rgba(255,255,255,.6); --pill-fg: #4a3608;
  --card-bg: #fff; --card-fg: #14131f; --card-muted: #4b4a5c; --bubble: #fffaf0;
  --hair: rgba(74,54,8,.12);
}

body { background: var(--bg); color: var(--fg); }

/* The light theme carries the landing's aurora. */
body.theme-light::before {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background:
    radial-gradient(60% 55% at 15% 10%, rgba(91,75,232,.22), transparent 60%),
    radial-gradient(50% 50% at 92% 20%, rgba(0,166,126,.18), transparent 60%),
    radial-gradient(55% 55% at 70% 95%, rgba(255,122,89,.16), transparent 60%);
}

.frame {
  position: relative; z-index: 1;
  width: 100%; height: 100%;
  padding: 72px;
  display: flex; flex-direction: column; justify-content: space-between;
}
body.fmt-story .frame { padding: 96px 72px 120px; }

/* Top bar: mark + wordmark, slide counter */
.top { display: flex; align-items: center; justify-content: space-between; }
.brand { display: flex; align-items: center; gap: 16px; }
.brand .mark { width: 56px; height: 56px; border-radius: 16px; overflow: hidden; }
.brand .mark svg { width: 100%; height: 100%; display: block; }
.brand .word { font-size: 34px; font-weight: 800; letter-spacing: -0.02em; }
.brand .word b { color: var(--accent); font-weight: 800; }
body.theme-violet .brand .word b, body.theme-ink .brand .word b { color: var(--accent); }
.counter { font-size: 28px; font-weight: 700; color: var(--muted); }
.counter:empty { display: none; }

/* Eyebrow pill */
.eyebrow {
  display: inline-flex; align-items: center; gap: 12px;
  padding: 14px 28px; border-radius: 999px;
  background: var(--pill-bg); color: var(--pill-fg);
  font-size: 27px; font-weight: 700;
  margin-bottom: 40px;
}
.eyebrow:empty { display: none; }

/* Headline and lead */
h1 {
  font-size: 88px; font-weight: 800; line-height: 1.04; letter-spacing: -0.025em;
  max-width: 900px;
}
h1.md { font-size: 74px; }
h1.sm { font-size: 60px; }
h1 em { font-style: normal; color: var(--accent); }
.lead {
  margin-top: 36px; font-size: 36px; font-weight: 500; line-height: 1.35;
  color: var(--muted); max-width: 860px;
}
.lead:empty { display: none; }
.lead strong { color: var(--fg); font-weight: 700; }

/* Bottom bar */
.bottom { display: flex; align-items: flex-end; justify-content: space-between; gap: 40px; }
.cta {
  display: inline-flex; align-items: center; gap: 14px;
  padding: 26px 44px; border-radius: 999px;
  background: var(--fg); color: var(--bg);
  font-size: 32px; font-weight: 800; white-space: nowrap;
}
body.theme-violet .cta, body.theme-ink .cta { background: #fff; color: #14131f; }
body.theme-light .cta { background: var(--primary); color: #fff; }
.cta:empty { display: none; }
.hint { font-size: 28px; font-weight: 700; color: var(--muted); display: inline-flex; align-items: center; gap: 10px; }
.hint:empty { display: none; }
.agentito { width: 220px; height: 220px; flex: none; }
.agentito.lg { width: 360px; height: 360px; }
.agentito.xl { width: 520px; height: 520px; }
.agentito svg { width: 100%; height: 100%; display: block; }

/* Card (chat, job "nunca", stats) */
.card {
  background: var(--card-bg); color: var(--card-fg);
  border-radius: 36px; padding: 40px;
  border: 1px solid var(--hair);
}
.never {
  display: flex; gap: 20px; align-items: flex-start;
  background: #ffdfd6; color: #4a1405; border-radius: 28px; padding: 30px 34px;
  font-size: 32px; font-weight: 500; line-height: 1.3;
}
.never b { font-weight: 800; white-space: nowrap; }
.never .ban { width: 44px; height: 44px; flex: none; margin-top: 2px; }

/* Chat */
.chat-head { display: flex; align-items: center; gap: 18px; padding-bottom: 26px; border-bottom: 1px solid rgba(20,19,31,.06); }
.chat-head .face { width: 76px; height: 76px; border-radius: 22px; background: #eae6ff; display: grid; place-items: center; }
.chat-head .face svg { width: 60px; height: 60px; }
.chat-head .name { font-size: 28px; font-weight: 800; }
.chat-head .status { display: flex; align-items: center; gap: 10px; font-size: 22px; font-weight: 500; color: var(--card-muted); margin-top: 4px; }
.chat-head .dot { width: 12px; height: 12px; border-radius: 50%; background: #0b3b2c; }
.msgs { margin-top: 28px; display: flex; flex-direction: column; gap: 18px; }
.msg { width: fit-content; max-width: 86%; padding: 20px 28px; border-radius: 28px; font-size: 30px; line-height: 1.35; }
.msg.owner { margin-left: auto; background: var(--primary); color: #fff; font-weight: 600; border-bottom-right-radius: 10px; }
.msg.agent { background: var(--bubble); color: #14131f; font-weight: 500; border-bottom-left-radius: 10px; }

/* List item (carousel slide) */
.num {
  font-size: 200px; font-weight: 800; line-height: .9; letter-spacing: -0.05em;
  color: var(--accent); margin-bottom: 24px;
}
.items { margin-top: 44px; display: flex; flex-direction: column; gap: 22px; }
.item { display: flex; gap: 22px; align-items: flex-start; font-size: 34px; font-weight: 500; line-height: 1.3; }
.item .tick { flex: none; width: 44px; height: 44px; border-radius: 14px; background: var(--pill-bg); color: var(--accent); display: grid; place-items: center; margin-top: 2px; }
.item .tick svg { width: 26px; height: 26px; }

/* Stat */
.stat-value { font-size: 220px; font-weight: 800; line-height: .95; letter-spacing: -0.05em; }
.stat-value.md { font-size: 160px; }
.stat-label { margin-top: 20px; font-size: 44px; font-weight: 700; }

/* Layout fixes measured on the first renders (12/9/2026) */
.top { margin-bottom: 48px; }
.agentito:empty { display: none; }
.bottom:empty { display: none; }

/* The chat template carries a whole conversation: everything scales down a
   notch so five messages fit inside 1350px without clipping the card. */
body.tpl-chat h1 { font-size: 60px; }
body.tpl-chat .lead { font-size: 30px; margin-top: 20px; }
body.tpl-chat .eyebrow { margin-bottom: 28px; font-size: 24px; padding: 12px 24px; }
body.tpl-chat .card { padding: 32px; margin-top: 36px !important; }
body.tpl-chat .chat-head { padding-bottom: 20px; }
body.tpl-chat .chat-head .face { width: 64px; height: 64px; border-radius: 18px; }
body.tpl-chat .chat-head .face svg { width: 50px; height: 50px; }
body.tpl-chat .chat-head .name { font-size: 26px; }
body.tpl-chat .chat-head .status { font-size: 20px; }
body.tpl-chat .msgs { margin-top: 22px; gap: 14px; }
body.tpl-chat .msg { font-size: 27px; padding: 16px 24px; border-radius: 24px; }
body.tpl-chat .bottom { margin-top: 32px !important; }
</style></head>
