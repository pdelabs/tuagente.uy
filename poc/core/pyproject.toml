[project]
name = "tuagente-core"
version = "0.1.0"
description = "POC engine: the tuagente.uy portal served by Pydantic AI instead of Hermes"
requires-python = ">=3.12"
dependencies = [
    # The `openrouter` extra exists for 2.43.0 (checked against PyPI metadata).
    "pydantic-ai-slim[openrouter]==2.43.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-frontmatter>=1.1",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "server"]
